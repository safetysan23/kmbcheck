<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>工地安全檢查報告系統 v10.4</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/gh/gitbrent/PptxGenJS@3.12.0/libs/jszip.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/gitbrent/PptxGenJS@3.12.0/dist/pptxgen.bundle.js"></script>
</head>
<body class="bg-slate-100 min-h-screen p-8">
    <div class="max-w-4xl mx-auto bg-white p-6 rounded-xl shadow-lg">
        <h1 class="text-2xl font-black mb-4">系統 v10.4 已更新</h1>
        <p class="mb-4">已針對 PowerPoint 匯出進行「邊界安全縮減」。所有內容現在都已縮排至 Slide 的絕對中心區域。</p>
        <button onclick="exportPPTX()" class="px-6 py-3 bg-orange-600 text-white font-black rounded-lg hover:bg-orange-500">再次匯出 PPTX 簡報</button>
    </div>

    <script>
        // ... (省略其他程式碼，保持不變) ...
        // 請將下方的 exportPPTX 函式替換為此版本：

        function exportPPTX() {
            try {
                syncGeneralInfo();
                let pptx = new PptxGenJS();
                pptx.defineLayout({ name: 'WIDE_169', width: 13.33, height: 7.5 });
                pptx.layout = 'WIDE_169';

                // Slide 1: 封面與看板 (縮窄版)
                let slide1 = pptx.addSlide();
                // 卡片寬度調整為 2.0，總寬度僅約 11.5 英吋，遠小於畫布的 13.33，保證不出界
                [
                    {t:"TOTAL CHECKED", v:reportData.totalChecked, x:0.5, c:"0F172A"},
                    {t:"CONFORMANCE", v:globalStats.conformance, x:2.8, c:"059669"},
                    {t:"TOTAL NC ITEM", v:globalStats.totalNC, x:5.1, c:"DC2626"},
                    {t:"TOTAL CONTRACTORS", v:globalStats.totalCompanies, x:7.4, c:"EA580C"},
                    {t:"% OF CONFORMITY", v:globalStats.conformityRate + "%", x:9.7, c:"2563EB"}
                ].forEach(item => {
                    slide1.addShape(pptx.ShapeType.roundRect, { x: item.x, y: 2.2, w: 2.0, h: 1.3, fill: { color: 'F8FAFC' } });
                    slide1.addText(item.t, { x: item.x, y: 2.3, w: 2.0, h: 0.3, fontSize: 8, bold: true, align: 'center', color: '64748B' });
                    slide1.addText(String(item.v), { x: item.x, y: 2.6, w: 2.0, h: 0.7, fontSize: 24, bold: true, align: 'center', color: item.c });
                });

                // Slide 2: 矩陣表格 (兩表寬度各自縮為 5.0，大幅內縮)
                let slide2 = pptx.addSlide();
                let tableOpts = { fontSize: 8, border: { color: 'E2E8F0', width: 1 }, w: 5.0 };
                // 左表
                slide2.addTable([[{text:"No."}, {text:"Category"}, {text:"NC"}]], { x: 0.5, y: 1.0, ...tableOpts });
                // 右表
                slide2.addTable([[{text:"No."}, {text:"Category"}, {text:"NC"}]], { x: 6.5, y: 1.0, ...tableOpts });

                // Slide 3+: 觀測卡片 (寬度縮為 5.2，左右起點分別為 0.5 和 6.5)
                for (let i = 0; i < reportData.issues.length; i += 2) {
                    let slideIssue = pptx.addSlide();
                    let chunk = reportData.issues.slice(i, i+2);
                    chunk.forEach((issue, subIdx) => {
                        let startX = subIdx === 0 ? 0.5 : 6.5;
                        slideIssue.addShape(pptx.ShapeType.roundRect, { x: startX, y: 0.5, w: 5.2, h: 6.0, fill: { color: 'FFFFFF' } });
                    });
                }

                pptx.writeFile({ fileName: `Safety_Report_Final.pptx` });
            } catch (error) {
                alert("匯出失敗，請檢查資料。");
            }
        }
    </script>
</body>
</html>

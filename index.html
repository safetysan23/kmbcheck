<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>工地安全檢查報告系統 v7.1 (泰山標準識別標籤版)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght=300;400;500;700;900&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; }
        
        @media print {
            .no-print { display: none !important; }
            .print-container { width: 100% !important; max-width: 100% !important; box-shadow: none !important; padding: 0 !important; margin: 0 !important; }
            .page-break { page-break-before: always; }
            body { background-color: #fff; }
            
            .preview-page {
                transform: none !important;
                margin: 0 auto !important;
            }
        }
        @page { 
            size: A4 landscape; 
            margin: 0; 
        }
        
        .preview-page {
            width: 1122px;
            height: 794px;
            min-width: 1122px;
            min-height: 794px;
            max-height: 794px;
            background: white;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            padding: 45px 60px; 
            box-sizing: border-box;
            transform-origin: top center;
        }
        
        #preview-wrapper {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .word-wrap-break {
            word-break: break-word;
            overflow-wrap: break-word;
            white-space: pre-line;
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col text-slate-900">

    <header class="bg-slate-900 text-white p-4 shadow-xl no-print flex justify-between items-center sticky top-0 z-50">
        <div class="flex items-center space-x-3">
            <div class="bg-white p-1.5 rounded-lg text-slate-900 h-9 flex items-center justify-center">
                <img src="https://www.tysan.com/all_images/tysan_head_logo.svg" alt="Tysan" class="h-6 w-auto">
            </div>
            <div>
                <h1 class="text-lg font-black leading-none uppercase tracking-tight">Site Safety Concerns</h1>
                <p class="text-[10px] text-slate-400 font-bold uppercase tracking-widest mt-1">Responsive Scaling Engine v7.1</p>
            </div>
        </div>
        <div class="flex space-x-2">
            <button onclick="exportJSON()" class="px-3 py-1.5 bg-slate-700 hover:bg-slate-600 rounded-lg text-sm font-bold transition">儲存數據</button>
            <label class="px-3 py-1.5 bg-slate-700 hover:bg-slate-600 rounded-lg text-sm font-bold transition cursor-pointer">
                匯入檔案 <input type="file" accept=".json" onchange="importJSON(event)" class="hidden">
            </label>
            <button onclick="window.print()" class="px-5 py-1.5 bg-blue-600 hover:bg-blue-500 rounded-lg text-sm font-black transition shadow-lg">匯出 橫向 PDF / 列印</button>
        </div>
    </header>

    <main class="flex-1 flex flex-col lg:flex-row no-print overflow-hidden">
        <section class="w-full lg:w-[30%] bg-slate-50 border-r border-slate-200 p-6 overflow-y-auto max-h-[calc(100vh-68px)]">
            <div class="space-y-6">
                
                <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
                    <h2 class="text-sm font-black text-slate-800 border-b pb-3 mb-4 flex items-center uppercase tracking-wider">
                        <span class="w-1 h-4 bg-blue-600 rounded-full mr-2"></span>General Info 基本資訊
                    </h2>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-[10px] font-black text-slate-400 uppercase mb-1">報告週期 (由 From)</label>
                            <input type="date" id="input-period-start" onchange="updateReport()" class="w-full border border-slate-200 rounded-xl p-2.5 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                        </div>
                        <div>
                            <label class="block text-[10px] font-black text-slate-400 uppercase mb-1">報告週期 (至 To)</label>
                            <input type="date" id="input-period-end" onchange="updateReport()" class="w-full border border-slate-200 rounded-xl p-2.5 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                        </div>
                        <div>
                            <label class="block text-[10px] font-black text-slate-400 uppercase mb-1">報告編寫人 (Prepared by)</label>
                            <input type="text" id="input-author" placeholder="姓名" oninput="updateReport()" class="w-full border border-slate-200 rounded-xl p-2.5 text-sm">
                        </div>
                        <div>
                            <label class="block text-[10px] font-black text-slate-400 uppercase mb-1">巡查日期 (Date)</label>
                            <input type="date" id="input-date" onchange="updateReport()" class="w-full border border-slate-200 rounded-xl p-2.5 text-sm">
                        </div>
                        <div class="col-span-2">
                            <label class="block text-[10px] font-black text-slate-400 uppercase mb-1">項目地點 (Project Location)</label>
                            <input type="text" id="input-project" placeholder="" oninput="updateReport()" class="w-full border border-slate-200 rounded-xl p-2.5 text-sm">
                        </div>
                    </div>
                </div>

                <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
                    <h2 class="text-sm font-black text-slate-800 border-b pb-3 mb-4 flex items-center uppercase tracking-wider">
                        <span class="w-1 h-4 bg-emerald-600 rounded-full mr-2"></span>Statistics 數據統計
                    </h2>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-[10px] font-black text-slate-400 uppercase mb-1">Total Checked Item</label>
                            <input type="number" id="input-total-checked" value="0" min="0" oninput="updateReport()" onchange="updateReport()" class="w-full border border-slate-200 rounded-xl p-2.5 text-sm font-black bg-slate-50">
                        </div>
                        <div>
                            <label class="block text-[10px] font-black text-emerald-600 uppercase mb-1">No. of Conformance item</label>
                            <div id="display-conformance" class="w-full bg-emerald-50 border border-emerald-100 rounded-xl p-2.5 text-sm font-black text-emerald-600">0</div>
                        </div>
                    </div>
                </div>

                <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
                    <div class="flex justify-between items-center border-b pb-3 mb-4">
                        <h2 class="text-sm font-black text-slate-800 flex items-center uppercase tracking-wider">
                            <span class="w-1 h-4 bg-indigo-600 rounded-full mr-2"></span>Joint inspected by 聯合巡查人員
                        </h2>
                        <button onclick="addMember()" class="text-[10px] font-black bg-indigo-600 text-white px-3 py-1 rounded-full hover:bg-indigo-700 transition">+ 新增</button>
                    </div>
                    <div id="member-inputs-container" class="space-y-2"></div>
                </div>

                <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
                    <div class="border-b pb-3 mb-4">
                        <h2 class="text-sm font-black text-slate-800 flex items-center uppercase tracking-wider">
                            <span class="w-1 h-4 bg-red-600 rounded-full mr-2"></span>Observations 缺失記錄
                        </h2>
                    </div>
                    
                    <div id="issue-inputs-container" class="space-y-4 mb-4"></div>
                    
                    <button onclick="addIssue()" class="w-full py-2.5 bg-red-600 text-white rounded-xl text-xs font-black hover:bg-red-700 transition shadow-md flex items-center justify-center space-x-1">
                        <span>+ 新增缺失項目</span>
                    </button>
                </div>

            </div>
        </section>

        <section id="preview-section" class="flex-1 bg-slate-800 p-4 overflow-y-auto max-h-[calc(100vh-68px)] flex flex-col items-center">
            <div id="preview-wrapper">
                <div id="print-preview-content" class="space-y-6"></div>
            </div>
        </section>
    </main>

    <div id="print-only-container" class="hidden print:block"></div>

    <script>
        const safetyCategories = [
            "Arc Welding & Flame Cutting Operation", "Lifting Appliances", "Lifting Gears", "Lifting Operations",
            "Loadshifting Machinery", "Other Plant & Machinery", "Powered Portable Tools / Hand Tools",
            "Plant Demarcation", "Access & Egress / Site Traffic", "Excavation / Earthwork", "Electricity",
            "Fire Prevention", "Housekeeping (e.g. Material Stacking & Drainage, etc.)", "Ventilation & Lighting",
            "Scaffolds & Working Platforms, Working at height", "Safety Rules, Signs & Banners",
            "Emergency & Welfare Facilities", "Personal Protective Equipment / Uniform",
            "Worker Competency / Authorization", "Health issue (Noise, Hazardous Substance, etc.)",
            "Overhead & Underground Utilities", "Hold Point Checklist Inspection / Permit to Work", "Other"
        ];

        let reportData = {
            title: "Site Safety Concerns",
            periodStart: "",
            periodEnd: "",
            author: "",
            date: "",
            project: "",
            totalChecked: 0,
            accompaniedList: [ { name: "", position: "" } ],
            issues: [ 
                { categoryIndex: "", subcontractor: "", badge: "RISK", description: "", imageBefore: "" },
                { categoryIndex: "", subcontractor: "", badge: "RISK", description: "", imageBefore: "" }
            ]
        };

        window.addEventListener('DOMContentLoaded', () => {
            document.getElementById('input-total-checked').value = reportData.totalChecked;
            document.getElementById('input-period-start').value = reportData.periodStart;
            document.getElementById('input-period-end').value = reportData.periodEnd;
            document.getElementById('input-date').value = reportData.date;
            document.getElementById('input-project').value = reportData.project;
            document.getElementById('input-author').value = reportData.author;

            renderMemberInputs();
            renderIssueInputs();
            updateReport();
            
            window.addEventListener('resize', adjustPreviewScale);
        });

        // 智能等比預覽縮放
        function adjustPreviewScale() {
            const section = document.getElementById('preview-section');
            const wrapper = document.getElementById('preview-wrapper');
            const pages = document.querySelectorAll('#print-preview-content .preview-page');
            if (!section || !wrapper || pages.length === 0) return;
            
            const availableWidth = section.clientWidth - 32; 
            const baseWidth = 1122; 
            
            let scale = availableWidth / baseWidth;
            if (scale > 1) scale = 1; 
            
            pages.forEach(page => {
                page.style.transform = `scale(${scale})`;
            });
            
            const baseHeight = 794;
            const scaledHeight = baseHeight * scale;
            const spacing = 24; 
            
            wrapper.style.height = `${(scaledHeight * pages.length) + (spacing * (pages.length - 1))}px`;
        }

        // --- 人員管理 ---
        function renderMemberInputs() {
            const container = document.getElementById('member-inputs-container');
            container.innerHTML = '';
            reportData.accompaniedList.forEach((m, idx) => {
                const div = document.createElement('div');
                div.className = "flex space-x-2 items-center bg-slate-50 p-2 rounded-xl border border-slate-100";
                div.innerHTML = `
                    <input type="text" placeholder="姓名" value="${m.name}" oninput="updateMember(${idx}, 'name', this.value)" class="flex-1 border p-2 text-xs rounded-lg border-slate-200">
                    <input type="text" placeholder="職位" value="${m.position}" oninput="updateMember(${idx}, 'position', this.value)" class="flex-1 border p-2 text-xs rounded-lg border-slate-200">
                    <button onclick="removeMember(${idx})" class="text-slate-300 hover:text-red-500 px-1 transition">✕</button>
                `;
                container.appendChild(div);
            });
        }
        function addMember() { reportData.accompaniedList.push({ name: "", position: "" }); renderMemberInputs(); updateReport(); }
        function removeMember(idx) { 
            if(reportData.accompaniedList.length > 1) {
                reportData.accompaniedList.splice(idx, 1); 
                renderMemberInputs(); updateReport(); 
            } else {
                reportData.accompaniedList[0] = { name: "", position: "" };
                renderMemberInputs(); updateReport();
            }
        }
        function updateMember(idx, f, v) { reportData.accompaniedList[idx][f] = v; updateReport(); }

        // --- 缺失事項管理 ---
        function renderIssueInputs() {
            const container = document.getElementById('issue-inputs-container');
            container.innerHTML = '';
            reportData.issues.forEach((issue, idx) => {
                const card = document.createElement('div');
                card.className = "p-4 bg-slate-50 rounded-2xl border border-slate-200 relative space-y-3 shadow-sm";
                
                let catOptions = `<option value="" ${issue.categoryIndex === "" ? 'selected' : ''}>-- 請選擇安全類別 --</option>`;
                catOptions += safetyCategories.map((c, i) => `<option value="${i}" ${issue.categoryIndex === i ? 'selected' : ''}>${i+1}. ${c}</option>`).join('');
                
                card.innerHTML = `
                    <button onclick="deleteIssue(${idx})" class="absolute top-3 right-3 text-slate-300 hover:text-red-500 transition">
                         <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M9 2a1 1 0 00-.894.553L7.382 4H4a1 1 0 000 2v10a2 2 0 002 2h8a2 2 0 002-2V6a1 1 0 100-2h-3.382l-.724-1.447A1 1 0 0011 2H9zM7 8a1 1 0 012 0v6a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v6a1 1 0 102 0V8a1 1 0 00-1-1z" clip-rule="evenodd"></path></svg>
                    </button>
                    <div class="grid grid-cols-1 gap-2 text-[11px] font-bold">
                        <div>
                            <label class="block text-slate-400 mb-1 uppercase text-[9px]">安全類別</label>
                            <select onchange="updateIssueField(${idx}, 'categoryIndex', this.value)" class="w-full border border-slate-200 p-2 rounded-lg bg-white text-xs text-slate-700">${catOptions}</select>
                        </div>
                        <div>
                            <label class="block text-slate-400 mb-1 uppercase text-[9px]">公司名稱</label>
                            <input type="text" value="${issue.subcontractor}" placeholder="" oninput="updateIssueField(${idx}, 'subcontractor', this.value)" class="w-full border border-slate-200 p-2 rounded-lg text-xs">
                        </div>
                        <div>
                            <label class="block text-slate-400 mb-1 uppercase text-[9px]">危險標籤</label>
                            <div class="flex flex-wrap gap-2 bg-white p-2 rounded-lg border border-slate-200">
                                ${['RISK', 'LAW', 'IMMINENT DANGER', 'GOOD'].map(b => `<label class="flex items-center space-x-1 cursor-pointer"><input type="radio" name="badge-${idx}" value="${b}" ${issue.badge===b?'checked':''} onchange="updateIssueField(${idx},'badge',this.value)"> <span class="text-[10px]">${b}</span></label>`).join('')}
                            </div>
                        </div>
                        <div>
                            <label class="block text-slate-400 mb-1 uppercase text-[9px]">缺失描述及整改要求</label>
                            <textarea oninput="updateIssueField(${idx}, 'description', this.value)" rows="4" class="w-full border border-slate-200 p-2 rounded-lg text-xs leading-snug" placeholder="請輸入細節 (支援 200 字以上長英文自動斷行)...">${issue.description}</textarea>
                        </div>
                        <div class="bg-amber-50 p-3 rounded-xl border border-amber-100">
                            <label class="block text-amber-700 mb-1 uppercase text-[9px] font-black italic underline">📸 上傳缺失相片 (自動壓縮)</label>
                            <input type="file" accept="image/*" onchange="handleImageUpload(${idx}, event)" class="w-full text-[10px] file:mr-2 file:py-1 file:px-3 file:rounded-full file:border-0 file:bg-amber-600 file:text-white file:font-black">
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function addIssue() { reportData.issues.push({ categoryIndex: "", subcontractor: "", badge: "RISK", description: "", imageBefore: "" }); renderIssueInputs(); updateReport(); }
        function deleteIssue(idx) { 
            if(reportData.issues.length > 1) {
                if(confirm("確定移除這項記錄？")) { reportData.issues.splice(idx,1); renderIssueInputs(); updateReport(); }
            } else {
                alert("至少需保留一項缺失事項。");
            }
        }
        
        function updateIssueField(idx, f, v) { 
            if (f === 'categoryIndex') { reportData.issues[idx][f] = v === "" ? "" : parseInt(v); } 
            else { reportData.issues[idx][f] = v; }
            updateReport(); 
        }
        
        function handleImageUpload(idx, e) {
            const file = e.target.files[0]; if (!file) return;
            const reader = new FileReader();
            reader.onload = (ev) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const max_size = 1000; 
                    let width = img.width; let height = img.height;
                    if (width > height) { if (width > max_size) { height *= max_size / width; width = max_size; } } 
                    else { if (height > max_size) { width *= max_size / height; height = max_size; } }
                    canvas.width = width; canvas.height = height;
                    const ctx = canvas.getContext('2d'); ctx.drawImage(img, 0, 0, width, height);
                    reportData.issues[idx].imageBefore = canvas.toDataURL('image/jpeg', 0.75); 
                    updateReport();
                };
                img.src = ev.target.result;
            };
            reader.readAsDataURL(file);
        }

        function formatDate(d) {
            if(!d) return '--/--/----';
            const [y,m,day] = d.split('-');
            return `${day}/${m}/${y}`;
        }

        function updateReport() {
            const totalCheckedInput = document.getElementById('input-total-checked');
            if (totalCheckedInput) {
                reportData.totalChecked = parseInt(totalCheckedInput.value) || 0;
            }

            reportData.periodStart = document.getElementById('input-period-start').value;
            reportData.periodEnd = document.getElementById('input-period-end').value;
            reportData.author = document.getElementById('input-author').value;
            reportData.date = document.getElementById('input-date').value;
            
            const projectInput = document.getElementById('input-project');
            if (projectInput) { reportData.project = projectInput.value; }

            const ncMatrix = Array(23).fill(0);
            reportData.issues.forEach(issue => { 
                if (issue.categoryIndex !== "" && !isNaN(issue.categoryIndex)) { ncMatrix[issue.categoryIndex]++; }
            });

            const totalNC = reportData.issues.length;
            const calculatedConformance = Math.max(0, reportData.totalChecked - totalNC);
            document.getElementById('display-conformance').innerText = calculatedConformance;

            const conformityRate = reportData.totalChecked > 0 ? Math.round((calculatedConformance / reportData.totalChecked) * 100) : 0;

            const html = renderReportHTML(totalNC, calculatedConformance, conformityRate, ncMatrix);
            document.getElementById('print-preview-content').innerHTML = html;
            document.getElementById('print-only-container').innerHTML = html;
            
            setTimeout(adjustPreviewScale, 10);
        }

        function renderReportHTML(totalNC, conformance, conformityRate, ncMatrix) {
            const periodStr = `${formatDate(reportData.periodStart)} to ${formatDate(reportData.periodEnd)}`;
            const dateStr = formatDate(reportData.date);
            
            const tysanLogoHTML = `
                <div class="h-[55px] flex items-center justify-end overflow-hidden">
                    <img src="https://www.tysan.com/all_images/tysan_head_logo.svg" alt="Tysan Logo" class="h-full w-auto object-contain">
                </div>
            `;
            
            let html = '';

            // 第一頁：數據審計總結
            html += `
            <div class="preview-page flex flex-col justify-between">
                <div>
                    <div class="border-b-[6px] border-slate-900 pb-3 mb-4 flex justify-between items-center">
                        <div>
                            <h1 class="text-4xl font-black text-slate-900 tracking-tighter uppercase leading-none">${reportData.title}</h1>
                            <p class="text-[10px] font-black text-slate-400 mt-1 tracking-[0.2em] uppercase">Period: ${periodStr} | Prepared by: ${reportData.author || '---'}</p>
                        </div>
                        ${tysanLogoHTML}
                    </div>

                    <div class="grid grid-cols-12 gap-4 mb-4">
                        <div class="col-span-4 flex flex-col gap-3">
                            <div class="bg-slate-100 p-3 rounded-xl border border-slate-200 flex-1 flex flex-col justify-center">
                                <span class="block text-[9px] font-black text-slate-400 uppercase mb-0.5">巡查日期 Date</span>
                                <span class="text-base font-black text-slate-900">${dateStr}</span>
                            </div>
                            <div class="bg-slate-100 p-3 rounded-xl border border-slate-200 flex-1 flex flex-col justify-center">
                                <span class="block text-[9px] font-black text-slate-400 uppercase mb-0.5">工程地點 Project Location</span>
                                <span class="text-base font-black text-slate-900 truncate block max-w-[280px]" title="${reportData.project || '---'}">${reportData.project || '---'}</span>
                            </div>
                        </div>
                        
                        <div class="col-span-8 bg-white p-3.5 rounded-xl border-2 border-slate-900 shadow-sm flex flex-col">
                            <span class="block text-[9px] font-black text-slate-400 uppercase mb-1.5 tracking-widest italic border-b pb-1 flex-shrink-0">Joint inspected by 聯合巡查人員</span>
                            <div class="grid grid-cols-2 gap-x-6 gap-y-1 text-xs font-bold text-slate-800 h-[92px] overflow-y-auto pr-1">
                                ${reportData.accompaniedList.map(m => m.name ? `<div>• ${m.name} <span class="text-slate-400 font-medium ml-1">(${m.position})</span></div>` : '').join('')}
                                ${reportData.accompaniedList.every(m => !m.name) ? '<div class="text-slate-300 italic text-xs col-span-2 py-4 text-center">No members listed.</div>' : ''}
                            </div>
                        </div>
                    </div>

                    <div class="border-4 border-slate-900 rounded-[1.25rem] overflow-hidden shadow-lg">
                        <div class="bg-slate-900 text-white p-1.5 text-center font-black tracking-widest text-[9px] uppercase italic">Overall Safety Summary</div>
                        <div class="grid grid-cols-4 divide-x divide-slate-100 text-center bg-white">
                            <div class="p-3">
                                <span class="block text-[9px] font-black text-slate-400 mb-0.5 uppercase">Total Checked Item</span>
                                <span class="text-3xl font-black text-slate-900">${reportData.totalChecked}</span>
                            </div>
                            <div class="p-3 bg-emerald-50">
                                <span class="block text-[9px] font-black text-emerald-700 mb-0.5 uppercase">No. of Conformance item</span>
                                <span class="text-3xl font-black text-emerald-600">${conformance}</span>
                            </div>
                            <div class="p-3 bg-red-50">
                                <span class="block text-[9px] font-black text-red-700 mb-0.5 uppercase tracking-tighter">No. of Non-Conformance</span>
                                <span class="text-3xl font-black text-red-600">${totalNC}</span>
                            </div>
                            <div class="p-3">
                                <span class="block text-[9px] font-black text-blue-700 mb-0.5 uppercase italic">% of Conformity</span>
                                <span class="text-4xl font-black text-blue-600">${conformityRate}%</span>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="border-t border-slate-200 pt-2 flex justify-between text-[9px] font-black text-slate-300 uppercase tracking-[0.3em]">
                    <span>Weekly Safety Review Report</span>
                    <span>P. 01</span>
                </div>
            </div>`;

            // 第二頁：不合規細項矩陣表
            const splitIndex = Math.ceil(safetyCategories.length / 2);
            const leftColCategories = safetyCategories.slice(0, splitIndex);
            const rightColCategories = safetyCategories.slice(splitIndex);

            html += `
            <div class="preview-page flex flex-col justify-between page-break">
                <div>
                    <div class="border-b-[2px] border-slate-100 pb-1 mb-4 flex justify-between items-center">
                        <h2 class="text-2xl font-black uppercase italic tracking-tighter text-slate-900">Safety Concerns Analysis</h2>
                        ${tysanLogoHTML}
                    </div>
                    
                    <div class="grid grid-cols-2 gap-x-6 text-[11px]">
                        <table class="border-collapse border border-slate-200 w-full">
                            <thead>
                                <tr class="bg-slate-900 text-white font-black uppercase text-[9px] tracking-wider">
                                    <th class="border border-slate-700 p-1.5 w-10">No.</th>
                                    <th class="border border-slate-700 p-1.5 text-left">Safety Item Category</th>
                                    <th class="border border-slate-700 p-1.5 w-16">NC</th>
                                </tr>
                            </thead>
                            <tbody class="font-bold text-slate-700">
                                ${leftColCategories.map((c, i) => `
                                <tr class="${ncMatrix[i] > 0 ? 'bg-red-50 text-red-800 font-extrabold' : 'hover:bg-slate-50'}">
                                    <td class="border border-slate-200 p-1 text-center font-black">${i + 1}</td>
                                    <td class="border border-slate-200 p-1 truncate max-w-[220px]" title="${c}">${c}</td>
                                    <td class="border border-slate-200 p-1 text-center font-black">${ncMatrix[i] || '-'}</td>
                                </tr>`).join('')}
                            </tbody>
                        </table>
                        
                        <table class="border-collapse border border-slate-200 w-full">
                            <thead>
                                <tr class="bg-slate-900 text-white font-black uppercase text-[9px] tracking-wider">
                                    <th class="border border-slate-700 p-1.5 w-10">No.</th>
                                    <th class="border border-slate-700 p-1.5 text-left">Safety Item Category</th>
                                    <th class="border border-slate-700 p-1.5 w-16">NC</th>
                                </tr>
                            </thead>
                            <tbody class="font-bold text-slate-700">
                                ${rightColCategories.map((c, i) => {
                                    const actualIndex = i + splitIndex;
                                    return `
                                    <tr class="${ncMatrix[actualIndex] > 0 ? 'bg-red-50 text-red-800 font-extrabold' : 'hover:bg-slate-50'}">
                                        <td class="border border-slate-200 p-1 text-center font-black">${actualIndex + 1}</td>
                                        <td class="border border-slate-200 p-1 truncate max-w-[220px]" title="${c}">${c}</td>
                                        <td class="border border-slate-200 p-1 text-center font-black">${ncMatrix[actualIndex] || '-'}</td>
                                    </tr>`;
                                }).join('')}
                                <tr class="bg-slate-100 font-black text-slate-900">
                                    <td colspan="2" class="border border-slate-200 p-1 text-right uppercase tracking-wider text-[9px]">Total Non-Conformities Observed</td>
                                    <td class="border border-slate-200 p-1 text-center text-red-600 underline">${totalNC}</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
                <div class="border-t border-slate-200 pt-2 flex justify-between text-[9px] font-black text-slate-300 uppercase tracking-widest">
                    <span>${reportData.project || 'Project'} | ${periodStr}</span>
                    <span>P. 02</span>
                </div>
            </div>`;

            // 核心變更點：將危險標籤樣式改回上一個版本中帶有泰山向量羅盤及色框的視覺設定
            const badges = {
                "RISK": `
                    <svg class="w-12 h-12" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="50" cy="50" r="32" stroke="#f59e0b" stroke-width="12"/>
                        <path d="M50 10V90" stroke="#f59e0b" stroke-width="12"/>
                        <path d="M10 50H90" stroke="#f59e0b" stroke-width="12"/>
                        <path d="M22 22L78 78" stroke="#f59e0b" stroke-width="10"/>
                        <path d="M22 78L78 22" stroke="#f59e0b" stroke-width="10"/>
                    </svg>
                    <div class="text-center font-black text-xs mt-0.5 text-amber-600 uppercase">RISK</div>
                `,
                "LAW": `
                    <svg class="w-12 h-12" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="50" cy="50" r="32" stroke="#64748B" stroke-width="12"/>
                        <path d="M50 10V90" stroke="#64748B" stroke-width="12"/>
                        <path d="M10 50H90" stroke="#64748B" stroke-width="12"/>
                        <path d="M22 22L78 78" stroke="#64748B" stroke-width="10"/>
                        <path d="M22 78L78 22" stroke="#64748B" stroke-width="10"/>
                    </svg>
                    <div class="text-center font-black text-xs mt-0.5 text-slate-600 uppercase">LAW</div>
                `,
                "IMMINENT DANGER": `
                    <svg class="w-12 h-12" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="50" cy="50" r="32" stroke="#b91c1c" stroke-width="14"/>
                        <path d="M50 10V90" stroke="#b91c1c" stroke-width="14"/>
                        <path d="M10 50H90" stroke="#b91c1c" stroke-width="14"/>
                        <path d="M22 22L78 78" stroke="#b91c1c" stroke-width="12"/>
                        <path d="M22 78L78 22" stroke="#b91c1c" stroke-width="12"/>
                    </svg>
                    <div class="text-center font-black text-[8px] font-extrabold mt-0.5 leading-none text-red-600 uppercase">IMMINENT<br>DANGER</div>
                `,
                "GOOD": `
                    <svg class="w-12 h-12" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="50" cy="50" r="32" stroke="#3b82f6" stroke-width="12"/>
                        <path d="M50 10V90" stroke="#3b82f6" stroke-width="12"/>
                        <path d="M10 50H90" stroke="#3b82f6" stroke-width="12"/>
                        <path d="M22 22L78 78" stroke="#3b82f6" stroke-width="10"/>
                        <path d="M22 78L78 22" stroke="#3b82f6" stroke-width="10"/>
                    </svg>
                    <div class="text-center font-black text-xs mt-0.5 text-blue-600 uppercase italic">Good</div>
                `
            };

            let pageNum = 3;
            for(let i=0; i<reportData.issues.length; i+=2) {
                const chunk = reportData.issues.slice(i, i+2);
                
                html += `<div class="preview-page flex flex-col justify-between page-break">
                    <div class="flex-1 flex flex-col min-h-[0]">
                        <div class="border-b-[2px] border-slate-100 pb-1 mb-3 flex justify-between items-center">
                            <h2 class="text-2xl font-black uppercase italic tracking-tighter text-red-600">Site Observations</h2>
                            ${tysanLogoHTML}
                        </div>
                        
                        <div class="grid grid-cols-2 gap-4 flex-1 min-h-[0]">
                            ${chunk.map(issue => {
                                const categoryText = (issue.categoryIndex !== "" && safetyCategories[issue.categoryIndex]) ? safetyCategories[issue.categoryIndex] : "[ 未選擇安全類別 ]";
                                return `
                                <div class="border-[3px] border-slate-900 rounded-[1.25rem] overflow-hidden flex flex-col bg-white shadow-md min-h-[0]">
                                    
                                    <div class="p-3 bg-white space-y-2 border-b border-slate-100 flex-shrink-0">
                                        <div class="flex justify-between items-start gap-2">
                                            <div class="inline-block bg-slate-900 text-white text-[8px] font-black px-2 py-1 rounded-full uppercase tracking-wider max-w-[70%] truncate" title="${categoryText}">${categoryText}</div>
                                            <div class="text-[10px] font-medium bg-slate-100 px-2 py-0.5 rounded border-l-[4px] border-red-600 text-slate-700 truncate max-w-[30%]">COMPANY: <span class="text-red-600 uppercase font-bold">${issue.subcontractor || 'PENDING'}</span></div>
                                        </div>
                                        
                                        <div class="text-[11px] text-slate-600 leading-snug grid grid-cols-12 gap-2 items-center">
                                            <div class="col-span-9">
                                                <span class="text-slate-400 block text-[8px] font-black uppercase tracking-wider mb-0.5">Comment(s) or Recommendation(s):</span>
                                                <p class="text-slate-900 font-normal word-wrap-break max-h-[54px] overflow-y-auto text-[11px] pr-1">${issue.description || '---'}</p>
                                            </div>
                                            <div class="col-span-3 flex flex-col justify-center items-center p-1 bg-slate-50 border border-dashed border-slate-200 rounded-xl h-[64px] w-full max-w-[72px] mx-auto">
                                                ${badges[issue.badge]||''}
                                            </div>
                                        </div>
                                    </div>
                                    
                                    <div class="flex-1 bg-slate-50 relative overflow-hidden flex items-center justify-center p-1.5 min-h-[0]">
                                        <div class="absolute top-2 left-2 bg-slate-900 text-white text-[7px] font-black px-1.5 py-0.5 rounded italic opacity-50 uppercase tracking-widest z-10">Evidence Photo</div>
                                        ${issue.imageBefore ? `<img src="${issue.imageBefore}" class="h-full w-full object-contain rounded shadow-sm">` : `<div class="flex flex-col items-center opacity-10"><svg class="w-10 h-10" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M4 3a2 2 0 00-2 2v10a2 2 0 002 2h12a2 2 0 002-2V5a2 2 0 00-2-2H4zm12 12H4l4-8 3 6 2-4 3 6z" clip-rule="evenodd"></path></svg><span class="font-black text-xs italic tracking-tighter mt-0.5 underline">MISSING IMAGE</span></div>`}
                                    </div>
                                </div>
                                `;
                            }).join('')}
                            
                            ${chunk.length === 1 ? `<div class="border-[3px] border-dashed border-slate-200 rounded-[1.25rem] flex items-center justify-center bg-slate-25/30 italic text-slate-300 text-xs font-bold">End of Observations</div>` : ''}
                        </div>
                    </div>
                    
                    <div class="border-t border-slate-200 pt-1.5 flex justify-between text-[9px] font-black text-slate-300 uppercase tracking-widest mt-2">
                        <span>Photographic Record Required for Reply</span>
                        <span>P. ${String(pageNum++).padStart(2, '0')}</span>
                    </div>
                </div>`;
            }

            return html;
        }

        // --- 備份與還原系統 (檔名命名格式：日期_項目地點_報告編寫人.json) ---
        function exportJSON() {
            const fileDate = reportData.date ? reportData.date : new Date().toISOString().slice(0,10);
            const fileProject = reportData.project ? reportData.project.trim().replace(/[\/\\?%*:|"<>]/g, '-') : '---';
            const fileAuthor = reportData.author ? reportData.author.trim().replace(/[\/\\?%*:|"<>]/g, '-') : '---';
            
            const computedFileName = `${fileDate}_${fileProject}_${fileAuthor}.json`;
            
            const blob = new Blob([JSON.stringify(reportData, null, 2)], {type: 'application/json'});
            const a = document.createElement('a'); 
            a.href = URL.createObjectURL(blob); 
            a.download = computedFileName; 
            a.click();
        }

        function importJSON(e) {
            const f = e.target.files[0]; if(!f) return;
            const reader = new FileReader();
            reader.onload = (ev) => {
                try {
                    reportData = JSON.parse(ev.target.result);
                    
                    document.getElementById('input-total-checked').value = reportData.totalChecked || 0;
                    document.getElementById('input-period-start').value = reportData.periodStart || "";
                    document.getElementById('input-period-end').value = reportData.periodEnd || "";
                    document.getElementById('input-author').value = reportData.author || "";
                    document.getElementById('input-date').value = reportData.date || "";
                    document.getElementById('input-project').value = reportData.project || "";
                    
                    renderMemberInputs(); 
                    renderIssueInputs(); 
                    updateReport();
                    alert("備份恢復成功！");
                } catch(err) { alert("讀取錯誤，請確保檔案為合法的 JSON 格式。"); }
            };
            reader.readAsText(f);
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>附近九巴 ETA 查詢</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f5f5f7;
            margin: 0;
            padding: 15px;
            color: #333;
        }

        h1 {
            text-align: center;
            color: #b32015;
            /* 九巴紅 */
            font-size: 24px;
            margin-bottom: 5px;
        }

        .status {
            text-align: center;
            color: #666;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .stop-card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            padding: 15px;
            margin-bottom: 15px;
            border-left: 5px solid #b32015;
        }

        .stop-name {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
            color: #111;
        }

        .route-row {
            display: flex;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid #eee;
        }

        .route-row:last-child {
            border-bottom: none;
        }

        .route-number {
            background-color: #b32015;
            color: white;
            font-weight: bold;
            padding: 4px 8px;
            border-radius: 6px;
            min-width: 50px;
            text-align: center;
            font-size: 14px;
        }

        .route-dest {
            flex: 1;
            margin-left: 10px;
            font-size: 14px;
            color: #555;
        }

        .eta-container {
            display: flex;
            gap: 5px;
        }

        .eta-time {
            background: #f0f0f0;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 13px;
            font-weight: 500;
        }

        .eta-time.next {
            background: #e6f4ea;
            color: #137333;
            font-weight: bold;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #999;
        }
    </style>
</head>

<body>

    <h1>九巴附近車站連 ETA</h1>
    <div id="status" class="status">正在定位你的位置...</div>

    <div id="bus-container">
        <div class="loading">等待 GPS 定位數據...</div>
    </div>

    <script>
        // 計算兩個經緯度之間的距離 (KM)
        function getDistance(lat1, lon1, lat2, lon2) {
            const R = 6371; // 地球半徑
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon / 2) * Math.sin(dLon / 2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
            return R * c;
        }

        // 啟動定位
        window.onload = function () {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(getNearbyStops, showError, {
                    enableHighAccuracy: true,
                    timeout: 10000
                });
            } else {
                document.getElementById('status').innerText = "你的瀏覽器不支援 GPS 定位。";
            }
        };

        function showError(error) {
            const status = document.getElementById('status');
            switch (error.code) {
                case error.PERMISSION_DENIED:
                    status.innerText = "請允許網站存取位置權限，否則無法尋找附近車站。";
                    break;
                case error.POSITION_UNAVAILABLE:
                    status.innerText = "無法取得當前位置。";
                    break;
                case error.TIMEOUT:
                    status.innerText = "定位逾時，請重試。";
                    break;
                default:
                    status.innerText = "定位發生未知錯誤。";
            }
        }

        async function getNearbyStops(position) {
            const userLat = position.coords.latitude;
            const userLng = position.coords.longitude;
            document.getElementById('status').innerText = `已定位！正在搜尋附近 500 米內的九巴站...`;

            try {
                // 1. 從九巴 API 獲取所有車站列表
                const response = await fetch('https://data.etabus.gov.hk/v1/transport/kmb/stop');
                const result = await response.json();
                const allStops = result.data;

                // 2. 篩選出 500 米（0.5 KM）內的車站
                const nearbyStops = allStops.filter(stop => {
                    const distance = getDistance(userLat, userLng, parseFloat(stop.lat), parseFloat(stop.long));
                    stop.distance = distance; // 順便記錄距離
                    return distance <= 0.5;
                });

                // 按距離由近至遠排序
                nearbyStops.sort((a, b) => a.distance - b.distance);

                if (nearbyStops.length === 0) {
                    document.getElementById('bus-container').innerHTML = '<div class="loading">附近 500 米內沒有尋找到九巴車站。</div>';
                    document.getElementById('status').innerText = "搜尋完畢。";
                    return;
                }

                document.getElementById('status').innerText = `搵到 ${nearbyStops.length} 個附近車站，正在載入預計到站時間 (ETA)...`;
                renderStops(nearbyStops);

            } catch (error) {
                console.error(error);
                document.getElementById('status').innerText = "獲取九巴數據失敗，請檢查網絡。";
            }
        }

        async function renderStops(stops) {
            const container = document.getElementById('bus-container');
            container.innerHTML = ''; // 清空 loading

            // 限制最多顯示 8 個站，費事太多讀取好耐
            const maxStops = stops.slice(0, 8);

            for (const stop of maxStops) {
                // 建立車站 Card
                const stopCard = document.createElement('div');
                stopCard.className = 'stop-card';

                const distanceInMeters = Math.round(stop.distance * 1000);
                stopCard.innerHTML = `
                    <div class="stop-name">${stop.name_tc} <span style="font-size:12px; color:#888; font-weight:normal;">(距離約 ${distanceInMeters}米)</span></div>
                    <div id="eta-list-${stop.stop}" class="loading">正在讀取此站路線...</div>
                `;
                container.appendChild(stopCard);

                // 異步獲取該車站的 ETA 數據
                fetchStopETA(stop.stop);
            }
            document.getElementById('status').innerText = "更新完畢（資料每分鐘自動更新需手動重新整理網頁）。";
        }

        async function fetchStopETA(stopId) {
            const etaListDiv = document.getElementById(`eta-list-${stopId}`);
            try {
                // 獲取該站的所有路線 ETA
                const response = await fetch(`https://data.etabus.gov.hk/v1/transport/kmb/stop-eta/${stopId}`);
                const result = await response.json();
                const etaData = result.data;

                if (!etaData || etaData.length === 0) {
                    etaListDiv.innerHTML = '<div style="color:#999; font-size:14px;">暫無巴士預計到站資料</div>';
                    return;
                }

                // 根據 路線+方向 整合時間
                const routeMap = {};
                etaData.forEach(item => {
                    // 只要有時間的班次（排走未有資料的）
                    if (item.eta) {
                        const key = `${item.route}_${item.dir}_${item.dest_tc}`;
                        if (!routeMap[key]) {
                            routeMap[key] = {
                                route: item.route,
                                dest: item.dest_tc,
                                times: []
                            };
                        }

                        // 計算剩餘分鐘數
                        const etaTime = new Date(item.eta);
                        const now = new Date();
                        const diffMins = Math.max(0, Math.round((etaTime - now) / 1000 / 60));

                        let displayTime = diffMins === 0 ? "即將到站" : `${diffMins} 分鐘`;
                        routeMap[key].times.push(displayTime);
                    }
                });

                // 轉為 HTML 顯示
                let html = '';
                const sortedKeys = Object.keys(routeMap).sort(); // 按巴士號碼排序

                if (sortedKeys.length === 0) {
                    etaListDiv.innerHTML = '<div style="color:#999; font-size:14px;">目前沒有即將到站的班次</div>';
                    return;
                }

                sortedKeys.forEach(key => {
                    const r = routeMap[key];
                    // 只取前 3 班車
                    const timesButtons = r.times.slice(0, 3).map((t, idx) => `
                        <span class="eta-time ${idx === 0 ? 'next' : ''}">${t}</span>
                    `).join('');

                    html += `
                        <div class="route-row">
                            <div class="route-number">${r.route}</div>
                            <div class="route-dest">往 ${r.dest}</div>
                            <div class="eta-container">
                                ${timesButtons}
                            </div>
                        </div>
                    `;
                });

                etaListDiv.innerHTML = html;

            } catch (error) {
                etaListDiv.innerHTML = '<div style="color:red; font-size:14px;">讀取失敗</div>';
            }
        }
    </script>
</body>

</html>
